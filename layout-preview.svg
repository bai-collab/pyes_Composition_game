<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><style>text{font:19px 'Microsoft JhengHei',sans-serif;fill:#edf0df}.panel{fill:#1b3440;stroke:#698d99}.gold{fill:#efc779}.ink{fill:#18303b}</style><rect width="1000" height="650" fill="#101e28"/><text x="25" y="35">結果頁修正：摘要與作品各自捲動，回營地固定可見</text><text x="25" y="75">桌面：35% 摘要／65% 作品</text><rect x="25" y="95" width="580" height="370" class="panel"/><rect x="35" y="105" width="185" height="275" class="panel"/><text x="48" y="145">勝利／敗北摘要</text><text x="48" y="183">長文字可捲動 ↕</text><text x="48" y="260">生命、墨水、段數</text><rect x="35" y="390" width="185" height="60" rx="6" class="gold"/><text x="70" y="428" class="ink">回到營地</text><rect x="230" y="105" width="365" height="345" class="panel"/><text x="250" y="148">已完成作品</text><text x="250" y="188">長文章在這裡捲動 ↕</text><text x="650" y="75">窄版：30% 摘要／70% 作品</text><rect x="650" y="95" width="325" height="500" class="panel"/><rect x="660" y="105" width="305" height="90" class="panel"/><text x="675" y="143">結果摘要，可捲動 ↕</text><text x="675" y="176">摘要內 72% 文本</text><rect x="660" y="204" width="305" height="44" rx="5" class="gold"/><text x="760" y="234" class="ink">回到營地</text><text x="674" y="282">摘要內28%操作，至少44px</text><rect x="660" y="298" width="305" height="285" class="panel"/><text x="678" y="342">作品區，自行捲動 ↕</text><text x="25" y="520">初始捲動位置為0也要看得到按鈕；</text><text x="25" y="557">捲摘要或文章時，按鈕位置保持不動。</text><text x="25" y="615">此圖為空間規劃，非瀏覽器實測證據。</text></svg>