function migrateAlignedLegacyBattle(battle){
  const pairs=LEGACY_TOPIC_SENTENCE_MAPS[battle?.topicId];
  if(!pairs)return;
  const byOldSentence=new Map(pairs.map(pair=>[pair.old,pair]));
  for(const pile of ['hand','draw','discard','draft']){
    if(!Array.isArray(battle[pile]))continue;
    for(const card of battle[pile]){
      if(!card||card.topicId!==battle.topicId||card.type!=='material')continue;
      const replacement=byOldSentence.get(card.sentence);
      if(!replacement)continue;
      card.bankId=replacement.bankId;
      card.kind=replacement.kind;
      card.sentence=replacement.sentence;
      card.allowed=[...replacement.allowed];
    }
  }
}

PIXEL_ART.svg = function(frame, scale = 4, palette = PIXEL_ART.palette) {
  const multiplier = scale === 3 ? 3 : 4;
  const rects = [];
  for (let y = 0; y < 32; y++) {
    const row = frame[y]; let x = 0;
    while (x < 32) {
      const key = row[x]; if (key === '.') { x++; continue; }
      const start = x; while (x < 32 && row[x] === key) x++;
      rects.push('<rect x="' + start + '" y="' + y + '" width="' + (x - start) + '" height="1" fill="' + palette[key] + '"/>');
    }
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="' + (32 * multiplier) + '" height="' + (32 * multiplier) + '" shape-rendering="crispEdges" aria-hidden="true">' + rects.join('') + '</svg>';
};

function monsterIdForBattle(battle){
  if(!battle||!['monster','elite','boss'].includes(battle.type))throw new Error('Unknown monster tier: '+battle?.type);
  if(battle.type==='boss')return 'blankPage';
  const ids=MONSTER_IDS_BY_TIER[battle.type],topicId=String(battle.topicId??'');let hash=0;
  for(let i=0;i<topicId.length;i++)hash=(hash+topicId.charCodeAt(i))>>>0;
  return ids[hash%ids.length];
}

  function showMetaShop(){showDialog('墨水商店',metaShopBody());}
  function closeDialog(){$('dialog').close();}
  function demoHelpControlsHtml(){const demo=game.demo;if(!demo?.helpHold)return'';return `<div class="demo-help-controls" id="demo-help-controls" aria-label="示範控制">${demo.auto?`${button('demo-pause',demo.paused?'繼續':'暫停',`id="demo-help-pause" aria-pressed="${demo.paused}"`)}${button('demo-takeover','我來接手','id="demo-help-takeover"')}`:'<span>示範已由你接手</span>'}${button('demo-end','結束示範','id="demo-help-end"')}</div>`;}
  function syncDemoHelpControls(){const controls=$('demo-help-controls');if(controls)controls.innerHTML=demoHelpControlsHtml();}
  function teachingDialogBody(){const b=game.run?.battle,videos=game.teachingVideos(),controls=demoHelpControlsHtml();if(game.helpCost()===1)return `${controls}<p id="help-cost">勇者、坦克、法師每場戰鬥第一次看教學要付 1 點能量；能量不足時，改成下回合少 1 點能量。同一場再看不用再付。</p>${button('help-confirm','確定觀看','id="help-confirm"','primary')}${button('close-dialog','先不看','id="close-dialog"')}`;return `${controls}<div class="teaching-episodes" aria-label="選擇教學動畫">${videos.map(video=>button('help-episode',esc(video.label),`id="help-episode-${esc(video.folder)}" data-id="${esc(video.folder)}" aria-pressed="${helpSelectedFolder===video.folder}"`,helpSelectedFolder===video.folder?'primary':'')).join('')}</div><div id="help-player"></div>${b?.defeated&&b.defeatWatched?button('revive','復活並繼續','id="revive-button"','primary'):''}`;}
  function renderTeachingDialog(){$('dialog-body').innerHTML=teachingDialogBody();}
  function showTeachingDialog(){if(!game.openHelp())return false;helpSelectedFolder=null;helpCheckId++;helpAbort?.abort();helpAbort=null;dialog.classList?.add('teaching-dialog');chipAudio.setDuck(true);showDialog(`看教學：〈${game.topic()?.topic||''}〉`,teachingDialogBody());return true;}
  function showHelpFallback(video){const player=$('help-player');if(!player)return;player.innerHTML=`<p>目前連不到教學動畫，可以複製網址，之後用瀏覽器打開。</p><code id="help-url">${esc(video.url)}</code>${button('help-copy','複製網址',`id="help-copy" data-id="${esc(video.folder)}"`)}${game.run?.battle?.defeated?button('help-seen','我看過了',`id="help-seen" data-id="${esc(video.folder)}"`):''}`;}
  function showHelpFrame(video){if(game.run?.battle?.defeated)game.markHelpWatched();renderTeachingDialog();const player=$('help-player');if(player)player.innerHTML=`<iframe id="help-frame" src="${esc(video.url)}" title="教學動畫：${esc(video.label)}" allow="fullscreen" allowfullscreen loading="lazy"></iframe>`;}
  function beginHelpEpisode(folder){const video=game.teachingVideos().find(item=>item.folder===folder);if(!video)return;helpAbort?.abort();helpAbort=null;const request=++helpCheckId;helpSelectedFolder=folder;game.markScaffoldWatched();renderTeachingDialog();if(typeof navigator!=='undefined'&&navigator.onLine===false){showHelpFallback(video);return;}if(typeof fetch!=='function'||typeof AbortController!=='function'){showHelpFrame(video);return;}const controller=new AbortController();helpAbort=controller;const timeout=setTimeout(()=>controller.abort(),8000);fetch(video.url,{mode:'no-cors',cache:'no-store',signal:controller.signal}).then(()=>{if(request!==helpCheckId||!dialog.open)return;showHelpFrame(video);}).catch(()=>{if(request===helpCheckId&&dialog.open)showHelpFallback(video);}).finally(()=>{clearTimeout(timeout);if(helpAbort===controller)helpAbort=null;});}
  async function copyHelpUrl(folder){const video=game.teachingVideos().find(item=>item.folder===folder);if(!video)return;try{if(typeof navigator==='undefined'||!navigator.clipboard?.writeText)throw new Error('clipboard');await navigator.clipboard.writeText(video.url);$('live-status').textContent='網址已複製。';}catch{const code=$('help-url'),range=document.createRange?.(),selection=window.getSelection?.();if(code&&range&&selection){range.selectNodeContents(code);selection.removeAllRanges();selection.addRange(range);}$('live-status').textContent='已選取網址，請自行複製。';}}
  function showArticle(){const b=game.run.battle;showDialog('已完成段落',`<h3>〈${esc(game.topic().topic)}〉</h3>${article(b.completed.toSorted((a,b)=>a.index-b.index))}`);}
  function showNotes(){const b=game.run.battle;showDialog('隨手筆記：選一句同題句子',`<p class="muted">每回合一次，花費 1 能量。選句後直接加入草稿。</p>${game.topic().bank.map(s=>button('note',`<small>${esc(KINDS[s.kind])}</small>${esc(s.text)}`,`data-id="${s.id}" ${b.draft.some(c=>c.bankId===s.id)?'disabled':''}`,'note-choice')).join('')}`);}
  function showCamp(action){showDialog(action==='upgrade'?'選一張卡升級':'選一張卡移除',game.run.deck.map(c=>button('camp-card',`${cardTitleMarkup(c.type,esc(describeCard(c)))}｜${c.type==='material'?'提升素材效果':c.type==='heal'?'提升回復量':c.type==='defend'?'提升格擋':c.type==='focus'?'提升抽牌':'提升攻擊'}`,`data-id="${c.id}" data-mode="${action}" ${action==='upgrade'&&c.level>=3?'disabled':''}`)).join(''));}
  let cardDrag=null,dragFrame=0,effectTimer=0,poseTimers=[];
  function clearDropMarks(){for(const e of document.querySelectorAll('.drop-before,.drop-after'))e.classList.remove('drop-before','drop-after');}
  function cancelCardDrag(){if(dragFrame)cancelAnimationFrame(dragFrame);dragFrame=0;const d=cardDrag;cardDrag=null;d?.ghost?.remove();d?.card?.classList.remove('dragging');clearDropMarks();if(d?.handle?.hasPointerCapture(d.pointerId))d.handle.releasePointerCapture(d.pointerId);}
  function locateDrop(){const d=cardDrag,sc=$('hand-scroll');if(!d||!d.moved||!sc)return;clearDropMarks();d.target=null;const r=sc.getBoundingClientRect();if(d.x<r.left||d.x>r.right||d.y<r.top||d.y>r.bottom)return;const c=document.elementFromPoint(d.x,d.y)?.closest('.card[data-card-id]');if(!c||c.dataset.pool!==d.pool||c.dataset.cardId===d.id)return;const b=c.getBoundingClientRect(),vertical=matchMedia('(max-width:849px)').matches;d.after=vertical?d.y>b.y+b.height/2:d.x>b.x+b.width/2;d.target=c.dataset.cardId;c.classList.add(d.after?'drop-after':'drop-before');}
  function dragTick(){const d=cardDrag,sc=$('hand-scroll');if(!d)return;if(d.moved&&sc){const r=sc.getBoundingClientRect();if(d.x>=r.left&&d.x<=r.right&&d.y>=r.top&&d.y<=r.bottom){const edge=30;sc.scrollBy(d.x<r.left+edge?-14:d.x>r.right-edge?14:0,d.y<r.top+edge?-12:d.y>r.bottom-edge?12:0);locateDrop();}}dragFrame=requestAnimationFrame(dragTick);}
  document.addEventListener('pointerdown',e=>{const handle=e.target.closest('.drag-handle');if(!handle||!game.activeBattle()||e.button!==0||cardDrag)return;const card=handle.closest('.card'),pool=handle.dataset.pool,id=handle.dataset.dragId;handle.focus({preventScroll:true});cardDrag={id,pool,handle,card,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,moved:false,snapshot:game.run.battle[pool].map(c=>c.id).join('|'),battle:game.run.battle};handle.setPointerCapture(e.pointerId);e.preventDefault();dragFrame=requestAnimationFrame(dragTick);});
  document.addEventListener('pointermove',e=>{const d=cardDrag;if(!d||d.pointerId!==e.pointerId)return;d.x=e.clientX;d.y=e.clientY;if(!d.moved&&Math.hypot(d.x-d.startX,d.y-d.startY)>7){d.moved=true;d.card.classList.add('dragging');d.ghost=document.createElement('div');d.ghost.className='drag-ghost';d.ghost.setAttribute('aria-hidden','true');d.ghost.textContent=d.pool==='draft'?'調整提交順序':'調整手牌順序';document.body.append(d.ghost);}if(d.moved){d.ghost.style.left=(Math.min(innerWidth-200,d.x+12))+'px';d.ghost.style.top=Math.max(0,d.y-45)+'px';locateDrop();}e.preventDefault();},{passive:false});
  document.addEventListener('pointerup',e=>{const d=cardDrag;if(!d||d.pointerId!==e.pointerId)return;d.x=e.clientX;d.y=e.clientY;locateDrop();const valid=d.moved&&d.target&&game.activeBattle()&&game.run.battle===d.battle&&game.run.battle[d.pool].map(c=>c.id).join('|')===d.snapshot;let index=-1;if(valid){const list=game.run.battle[d.pool];index=list.findIndex(c=>c.id===d.target)+(d.after?1:0);if(list.findIndex(c=>c.id===d.id)<index)index--;}cancelCardDrag();if(valid)game.reorder(d.pool,d.id,index);});
  document.addEventListener('pointercancel',e=>{if(cardDrag?.pointerId===e.pointerId)cancelCardDrag();});
  document.addEventListener('lostpointercapture',e=>{if(cardDrag?.pointerId===e.pointerId)cancelCardDrag();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cardDrag){e.preventDefault();cancelCardDrag();$('live-status').textContent='已取消拖曳，順序保持原樣。';return;}const h=e.target.closest('.drag-handle');if(!h||!game.activeBattle())return;const list=game.run.battle[h.dataset.pool],i=list.findIndex(c=>c.id===h.dataset.dragId);let dest;if(['ArrowLeft','ArrowUp'].includes(e.key))dest=i-1;if(['ArrowRight','ArrowDown'].includes(e.key))dest=i+1;if(e.key==='Home')dest=0;if(e.key==='End')dest=list.length-1;if(dest!==undefined){e.preventDefault();cancelCardDrag();game.reorder(h.dataset.pool,h.dataset.dragId,dest);}});
  function cancelCombatEffect(){clearTimeout(effectTimer);effectTimer=0;for(const timer of poseTimers)clearTimeout(timer);poseTimers=[];const el=$('battle-fx');if(el){el.innerHTML='';delete el.dataset.active;}const hero=$('hero-actor'),enemy=$('enemy-actor'),defeated=game.run?.battle?.defeated;if(hero)hero.dataset.pose=defeated?'ko':'idle';if(enemy)enemy.dataset.pose='idle';}
  function returnActorToIdle(id,pose,duration){let timer=0;timer=setTimeout(()=>{poseTimers=poseTimers.filter(item=>item!==timer);const actor=$(id);if(actor&&actor.dataset.pose===pose){const defeated=id==='hero-actor'&&game.run?.battle?.defeated;actor.dataset.pose=defeated?'ko':'idle';}},duration);poseTimers.push(timer);}
  function playCombatEffect(side,amount){if(!game.activeBattle()||!['hero','monster','block'].includes(side)||!Number.isFinite(amount)||amount<0)return false;cancelCombatEffect();const el=$('battle-fx');if(!el)return false;const hero=$('hero-actor'),enemy=$('enemy-actor'),b=game.run.battle,characterId=game.run?.charId||'hero',character=PIXEL_CHARACTERS[characterId]||PIXEL_CHARACTERS.hero;if(side==='hero'){if(hero){hero.dataset.pose='cast';returnActorToIdle('hero-actor','cast',480);}if(amount>0&&enemy){enemy.dataset.pose='hurt';returnActorToIdle('enemy-actor','hurt',300);}}else if(side==='monster'){if(enemy){enemy.dataset.pose='attack';returnActorToIdle('enemy-actor','attack',480);}if(amount>0&&hero){hero.dataset.pose='hurt';returnActorToIdle('hero-actor','hurt',300);}}el.dataset.active=side;const isHero=characterId==='hero',attackClass='battle-pixel-hit battle-pixel-character-attack'+(isHero?' battle-pixel-ink-slash':''),defenseClass='battle-pixel-block battle-pixel-character-defense'+(isHero?' battle-pixel-book-shield':''),pixel=side==='hero'&&amount>0?pixelEffectMarkup(isHero?'inkSlash':'attack',character.fx.attack,character.palette,attackClass,characterId,character.reduced.attack):side==='block'?pixelEffectMarkup(isHero?'bookShield':'defense',character.fx.defense,character.palette,defenseClass,characterId,1):'',monsterFx=side==='monster'?pixelMonsterEffectMarkup(monsterIdForBattle(b)):'',number=side==='block'?(amount>0?'+'+Math.floor(amount):''):String(Math.floor(amount));el.innerHTML=pixel+monsterFx+(number?'<span class="fx-number '+side+'">'+number+'</span>':'');effectTimer=setTimeout(cancelCombatEffect,900);return true;}
  globalThis.PenSpireEffects={play:playCombatEffect,cancel:cancelCombatEffect};
  game.onCombatEffect=(side,amount)=>{const b=game.run?.battle;requestAnimationFrame(()=>{if(game.run?.battle===b&&game.activeBattle())playCombatEffect(side,amount);});};

  document.addEventListener('change',e=>{if(e.target.id==='draft-target')game.setTarget(Number(e.target.value));});
  document.addEventListener('click',e=>{const el=e.target.closest('button[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=el.dataset.id;if(!noGenericAudioActions.has(a))chipAudio.queueSfx('click');
    if(a==='demo'){clearDemoTimer();game.startDemo();}if(a==='demo-pause'){clearDemoTimer();game.toggleDemoPause();syncDemoHelpControls();}if(a==='demo-speed'){clearDemoTimer();game.setDemoSpeed(id);}if(a==='demo-takeover'){clearDemoTimer();game.takeOver();syncDemoHelpControls();}if(a==='demo-end'){clearDemoTimer();if(game.demo?.helpHold&&$('dialog')?.open)closeDialog();game.endDemo();}
    if(a==='help-open'||a==='defeat-help')showTeachingDialog();if(a==='help-confirm'){if(game.confirmHelp())renderTeachingDialog();}if(a==='help-episode')beginHelpEpisode(id);if(a==='help-copy')void copyHelpUrl(id);if(a==='help-seen'){const video=game.teachingVideos().find(item=>item.folder===id);game.markHelpWatched();renderTeachingDialog();if(video)showHelpFallback(video);}if(a==='revive'){if(game.revive())closeDialog();}if(a==='defeat-end')game.giveUp();
    if(a==='reorder'){const list=game.run?.battle?.[el.dataset.pool];if(list)game.reorder(el.dataset.pool,id,list.findIndex(c=>c.id===id)+Number(el.dataset.step));}
    if(a==='feedback')showDialog('完整回饋',game.feedbackHistoryHtml());if(a==='role-hints'){const h=game.hints();if(h.genre)showDialog('角色提示','<p>文體：'+esc(h.genre)+'</p>'+(h.formula?'<p>'+esc(h.formula)+'</p>'+(game.run.charId==='teacher'?'<p>卡片上的金框與文字提示可接在目前段落。</p>':''):''));}
    if(a==='character')game.choose(id);if(a==='new'){if(game.run?.status==='active')showDialog('開始新的冒險？',`<p>新的冒險會取代目前這一局。局外墨水與角色不受影響。</p>${button('confirm-new','開始新冒險','','primary')}${button('close-dialog','保留原來的冒險')}`);else game.startRun();}
    if(a==='confirm-new'){closeDialog();game.startRun();}if(a==='resume')game.resume();if(a==='menu'){closeDialog();game.menu();}if(a==='last-result'){game.view='result';render();}if(a==='meta-shop')showMetaShop();if(a==='howto')showDialog('第一次來？看玩法',menuHowtoBody());if(a==='buy-hermit')game.buyHermit();if(a==='upgrade-meta'){game.upgradeMeta();if($('dialog')?.open)showMetaShop();}if(a==='meta-shop-buy'){game.buyMetaUpgrade(id);showMetaShop();}if(a==='node')game.enterNode(id);if(a==='play')game.play(id);if(a==='undo')game.undo(id);if(a==='submit')game.submit();if(a==='end-turn')game.endTurn();if(a==='mulligan')game.mulligan();if(a==='note-dialog')showNotes();if(a==='note'){if(game.note(id))closeDialog();}if(a==='article')showArticle();if(a==='close-dialog')closeDialog();if(a==='reward')game.reward(id);if(a==='camp-heal')game.camp('heal');if(a==='camp-upgrade-dialog')showCamp('upgrade');if(a==='camp-remove-dialog')showCamp('remove');if(a==='camp-card'){if(game.camp(el.dataset.mode,id))closeDialog();}if(a==='buy')game.buy(id);if(a==='leave-shop')game.completeNode();
    if(a==='practice-menu')showDialog('寫作練功房',`<p class="muted">原生格式與句子編排練習，每題首次完成得 4 墨水。</p>${PRACTICES.map(p=>button('practice',`${p.title}${game.meta.practices[p.id]?' ✓':''}`,`data-id="${p.id}"`)).join('')}`);if(a==='practice'){closeDialog();game.startPractice(id);}if(a==='practice-pick')game.practicePick(Number(el.dataset.index));if(a==='practice-submit')game.practiceSubmit();if(a==='practice-reset')game.practiceReset();if(a==='practice-undo'&&game.practice){game.practice.selected.pop();game.changed();}
  });
  addEventListener('resize',()=>requestAnimationFrame(drawMap));
  game.onChange=()=>{render();syncDemoTimer();};render();
}
